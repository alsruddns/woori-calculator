name: Calculator Server Read-only Audit

on:
  push:
    branches:
      - codex/calculator-server-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect production deployment metadata without changes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/services/compose

            echo "== Compose files =="
            find . -maxdepth 1 -type f \( -name 'compose.yml' -o -name 'compose.yaml' -o -name 'docker-compose.yml' -o -name 'docker-compose.yaml' \) -printf '%f\n' | sort

            echo "== Environment files and required key presence (values hidden) =="
            for file in .env.moneybook .env.portal; do
              if [ -r "$file" ]; then
                echo "$file: present"
                for key in DATABASE_URL DB_TARGET PRODUCTION_DB_ALLOWED_HOSTS WORLD_BANK_DATA_SOURCE WORLD_BANK_DB_PRODUCTION_ENABLED; do
                  if grep -Eq "^[[:space:]]*(export[[:space:]]+)?${key}[[:space:]]*=" "$file"; then
                    echo "  $key: set"
                  else
                    echo "  $key: missing"
                  fi
                done
              else
                echo "$file: absent or unreadable"
              fi
            done

            echo "== Compose project and service names =="
            docker compose ls --format json | python3 -c 'import json,sys; [print("project={} status={}".format(p.get("Name", "?"), p.get("Status", "?"))) for p in json.load(sys.stdin)]'
            if compose_config="$(docker compose --env-file .env.portal --env-file .env.moneybook config --no-interpolate --format json 2>/dev/null)"; then
              printf '%s' "$compose_config" | python3 -c 'import json,sys; c=json.load(sys.stdin); keys=lambda v: v.keys() if isinstance(v,dict) else [str(x).split("=",1)[0] for x in v or []]; names=lambda v: v.keys() if isinstance(v,dict) else v or []; [(print("service={} image={} container_name={} env_files={} environment_keys={} depends_on={} networks={} volumes={}".format(n,s.get("image","?"),s.get("container_name","?"),",".join(str(x.get("path",x)) if isinstance(x,dict) else str(x) for x in s.get("env_file",[]) or []),",".join(keys(s.get("environment",{}) or {})),",".join(names(s.get("depends_on",{}) or {})),",".join(names(s.get("networks",{}) or {})),",".join("{}:{}".format(v.get("source",""),v.get("target","")) if isinstance(v,dict) else str(v) for v in s.get("volumes",[]) or [])))) for n,s in c.get("services",{}).items() if n in ("calculator","portal")]'
            else
              echo "Compose metadata inspection with both existing env files: failed (details suppressed)"
            fi
            if docker compose --env-file .env.portal --env-file .env.moneybook config -q >/dev/null 2>&1; then
              echo "Compose interpolation with both existing env files: passed"
            else
              echo "Compose interpolation with both existing env files: failed (details suppressed)"
            fi

            echo "== Running containers (names and states only) =="
            docker ps -a --format '{{.Names}} {{.Status}}'

            echo "== Calculator image, project, health, digest, and network names =="
            if docker inspect calculator >/dev/null 2>&1; then
              docker inspect calculator --format 'configured_image={{.Config.Image}} image_id={{.Image}} project={{index .Config.Labels "com.docker.compose.project"}} service={{index .Config.Labels "com.docker.compose.service"}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}'
              image_id="$(docker inspect calculator --format '{{.Image}}')"
              docker image inspect "$image_id" --format 'repo_digests={{join .RepoDigests ","}}'
              docker inspect calculator --format '{{range $name, $_ := .NetworkSettings.Networks}}network={{$name}}{{"\n"}}{{end}}'
            else
              echo "Calculator container: absent"
            fi

            echo "== Nginx route-related active configuration (selected lines only) =="
            nginx_conf=/opt/services/nginx/conf.d/default.conf
            if [ -r "$nginx_conf" ]; then
              grep -nE 'valid_locale|location[^;{]*(calculators|calculator-sitemap)|calculator:3001|pt-br|zh-tw|(^|[^a-z])fil([^a-z]|$)' "$nginx_conf" || true
            else
              echo "Active Nginx config: absent or unreadable"
            fi
            if docker exec nginx nginx -t >/dev/null 2>&1; then
              echo "active Nginx container nginx -t: passed"
            else
              echo "active Nginx container nginx -t: failed or unavailable (details suppressed)"
            fi

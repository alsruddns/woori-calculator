name: Deploy Calculator

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/woori-calculator:latest
          build-args: |
            NEXT_PUBLIC_GA_ID=G-ZJSJW06SCX

      - name: Deploy to iwinv
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/services/compose
            docker compose --env-file .env.moneybook pull calculator
            docker compose --env-file .env.moneybook up -d calculator

      - name: Wait for calculator deployment and sitemap
        env:
          INDEXNOW_KEY: bc52d22e38f7489988b717aa090fbdfb
        run: |
          for attempt in $(seq 1 18); do
            key_content="$(curl --fail --silent "https://www.woori.today/${INDEXNOW_KEY}.txt" || true)"
            if curl --fail --silent "https://www.woori.today/ko/calculators" >/dev/null \
              && curl --fail --silent "https://www.woori.today/calculator-sitemap.xml" >/dev/null \
              && [ "$key_content" = "$INDEXNOW_KEY" ]; then
              echo "Calculator page, sitemap, and IndexNow key are available."
              exit 0
            fi
            echo "Waiting for calculator routes and IndexNow key (attempt ${attempt}/18)."
            sleep 10
          done
          echo "Deployment verification failed; IndexNow URLs were not submitted."
          exit 1

      - name: Submit calculator URLs to IndexNow
        env:
          INDEXNOW_KEY: bc52d22e38f7489988b717aa090fbdfb
        run: node scripts/submit-indexnow.mjs

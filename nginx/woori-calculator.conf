# ---------------------------------------------------------
# Calculator Next.js assets
# ---------------------------------------------------------

location ^~ /_assets/calculator/_next/ {
    proxy_pass http://calculator:3001/_next/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /_assets/calculator/ {
    proxy_pass http://calculator:3001;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ---------------------------------------------------------
# Legacy redirect
# ---------------------------------------------------------

location = /calculator {
    return 301 https://www.woori.today/ko/calculators;
}

location = /calculator/ {
    return 301 https://www.woori.today/ko/calculators;
}

# ---------------------------------------------------------
# Locale validation reference
# ---------------------------------------------------------
# The production default.conf already has the map above in the parent context.
# Keep only one active definition; map directives belong in the http context.

# ---------------------------------------------------------
# Calculator service
# ---------------------------------------------------------

location ~ "^/[a-z]{2,3}(?:-[a-z]{2})?/calculators(?:/.*)?$" {
    if ($valid_locale = 0) {
        return 404;
    }

    proxy_pass http://calculator:3001;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# ---------------------------------------------------------
# Calculator sitemap
# ---------------------------------------------------------

location = /calculator-sitemap.xml {
    proxy_pass http://calculator:3001/sitemap.xml;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
